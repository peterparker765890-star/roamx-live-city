name: ROAMX Automatic News Updates

on:
  schedule:
    - cron: "*/30 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: roamx-news-update
  cancel-in-progress: false

jobs:
  update-news:
    name: Collect Latest News
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ROAMX Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run ROAMX News Collector
        run: python scripts/update_news.py

      - name: Commit Updated News
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add news.json

          if git diff --cached --quiet; then
            echo "No news changes to commit."
          else
            git commit -m "Update ROAMX news feed"
            git push
          fi