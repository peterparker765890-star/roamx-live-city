name: ROAMX Automatic World News Update

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: roamx-news-collector
  cancel-in-progress: false

jobs:
  update-news:
    name: Collect and Update News
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ROAMX Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run ROAMX News Collector
        run: python news_collector.py

      - name: Save Updated News Database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add news.json

          if ! git diff --cached --quiet; then
            git commit -m "Automated ROAMX news update"
            git push
          else
            echo "No news database changes to save."
          fi